<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BFSU K–2 revision decks</title>
<style>
/* Visual tokens matched to the Edition-2 science chapter HTML (BFSU-A-11-Student-Lesson-v3.html): style only, no lesson content. */
:root{--bg:#faf8f3;--panel:#ffffff;--ink:#1d2433;--muted:#566074;--line:#d9d4c7;--accent:#0f6b6b;--accent-2:#e9f3f2;--dye:#8a2b7a;--dye-soft:#f4e6f1;
  --good:#1f6f3a;--good-bg:#e5f3e8;--bad:#9a2c1f;--bad-bg:#fbe9e5;--warn-bg:#fff4d6;--radius:10px;--fs:17px}
*{box-sizing:border-box} html{font-size:var(--fs);height:100%} body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5}
h1,h2,h3{line-height:1.2;margin:.2em 0 .5em} h2{font-size:1.3rem;color:var(--accent)} h3{font-size:1.08rem;margin:.5em 0 .3em} p{margin:.4em 0 .6em}
a{color:var(--accent)} button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:.35em .8em;min-height:2.3em}
button:hover{filter:brightness(1.1)} button.secondary{background:var(--panel);color:var(--accent)} button.secondary:hover{background:var(--accent-2);filter:none}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);text-decoration:underline;padding:.2em .4em;min-height:2em}
button[disabled]{opacity:.45;cursor:not-allowed} :focus-visible{outline:3px solid #f0a500;outline-offset:2px}
textarea{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:.5em;background:#fff;resize:vertical}
input[type=text],input[type=number],select{border:1.5px solid var(--line);border-radius:6px;padding:.3em .45em;background:#fff}
.deck{display:grid;grid-template-rows:auto auto 1fr auto;height:100vh;height:100dvh}
.draftbar{background:var(--dye);color:#fff;padding:2px 12px;font-size:.72rem;text-align:center;letter-spacing:.02em}
header.top{background:var(--panel);border-bottom:2px solid var(--line);padding:.4rem 1rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;justify-content:space-between}
.brand{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1} .brand small{display:block;color:var(--muted);font-size:.74rem;font-weight:400}
.progress{display:flex;align-items:center;gap:.5rem;font-size:.88rem} .counter{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.bar{width:150px;height:12px;border:1.5px solid var(--accent);border-radius:8px;overflow:hidden;background:#fff} .bar>span{display:block;height:100%;background:var(--accent);width:0}
.controls{display:flex;flex-wrap:wrap;gap:.35rem;align-items:center} .controls button{padding:.25em .65em;min-height:2.1em;font-size:.88rem}
.stage{overflow:hidden;padding:.7rem 1rem;display:flex;justify-content:center}
.slide{width:100%;max-width:1050px;height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1.2rem}
.slide[hidden]{display:none} .slide>h2{outline:none}
.kicker{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:.1em .5em;border-radius:4px;background:var(--accent-2);color:var(--accent);margin-bottom:.2em}
.kicker.dye{background:var(--dye-soft);color:var(--dye)} .time{font-size:.8rem;color:var(--muted);font-weight:600}
.lead{font-size:1.06rem} .small{font-size:.86rem} .muted{color:var(--muted)} ul,ol{margin:.3em 0;padding-left:1.35em} li{margin:.15em 0}
nav.bottom{display:flex;align-items:center;justify-content:space-between;gap:.6rem;padding:.45rem 1rem;border-top:2px solid var(--line);background:var(--panel)}
.navmsg{flex:1;text-align:center;font-size:.88rem;color:#8a4b00;min-height:1.2em}
.menu{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);background:var(--panel);border-left:2px solid var(--line);box-shadow:-6px 0 24px rgba(29,36,51,.16);padding:.7rem .9rem;overflow:auto;z-index:30}
.menu[hidden]{display:none} .menu ol{list-style:none;padding:0;margin:.2rem 0 .5rem;display:flex;flex-wrap:wrap;gap:.3rem}
.menu li{margin:0} .menu li button{font-size:.84rem;padding:.2em .7em;min-height:2em;border-radius:20px;background:var(--panel);color:var(--accent);text-align:left}
.menu li button[aria-current="step"]{background:var(--accent);color:#fff} .menu .sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:.5rem 0 .1rem}
.callout,.note{border-left:5px solid var(--accent);background:var(--accent-2);padding:.5rem .85rem;border-radius:0 8px 8px 0;margin:.5rem 0}
.callout.dye{border-color:var(--dye);background:var(--dye-soft)} .callout.warn,.alert.warn{border-left:5px solid #b7791f;background:var(--warn-bg)}
.alert{padding:.5rem .85rem;border-radius:0 8px 8px 0;margin:.5rem 0;border-left:5px solid var(--accent);background:var(--accent-2)}
.alert.ok{border-color:var(--good);background:var(--good-bg)} .alert.bad,.status{border-left:5px solid var(--bad);background:var(--bad-bg);padding:.5rem .85rem;border-radius:0 8px 8px 0;margin:.5rem 0}
.check{display:flex;gap:.55em;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:.45em .65em;margin:.4em 0;background:#fff;cursor:pointer}
.check input{margin-top:.3em;transform:scale(1.25);flex:none}
.opt{display:flex;gap:.55em;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:.42em .6em;margin:.3em 0;cursor:pointer;background:#fff}
.opt:hover{border-color:var(--accent)} .opt input{margin-top:.3em;transform:scale(1.2);flex:none}
fieldset{border:0;padding:0;margin:0} legend{padding:0}
.btnrow{display:flex;flex-wrap:wrap;gap:.45rem;margin:.6rem 0}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:.1em .5em;border-radius:4px;background:var(--accent-2);color:var(--accent);margin-right:.3em}
table{border-collapse:collapse;width:100%} th,td{border:1px solid var(--line);padding:.3em .45em;text-align:left;vertical-align:top} th{background:var(--accent-2);font-size:.86rem}
table.rep td:first-child{width:24%} .reference-slide table td:first-child{width:24%}
.grid2{display:grid;grid-template-columns:1.05fr 1fr;gap:.9rem} .grid2.app{grid-template-columns:1.4fr 1fr} table.data th,table.data td{font-size:.86rem;padding:.18em .35em;line-height:1.3} .cols{columns:2;column-gap:1.6rem} .cols li{break-inside:avoid}
.hintbox{border-left:5px solid var(--dye);background:var(--dye-soft);padding:.5rem .85rem;border-radius:0 8px 8px 0;margin:.4rem 0}
.checklist{list-style:none;padding-left:0;display:flex;flex-wrap:wrap;gap:.15rem 1.2rem} .checklist li::before{content:"☐ ";color:var(--accent)} ul.cols2{columns:2;column-gap:1.4rem} ul.cols2 li{break-inside:avoid}
.labels .tag.dye{background:var(--dye-soft);color:var(--dye)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.private{position:fixed;top:0;left:0;bottom:0;width:min(560px,96vw);background:#fffdf5;border-right:3px dashed #b7791f;box-shadow:6px 0 24px rgba(29,36,51,.18);padding:.7rem .9rem;overflow:auto;z-index:40}
.private[hidden]{display:none} .private .pbanner{background:var(--dye);color:#fff;border-radius:8px;padding:.4rem .7rem;font-weight:700;margin-bottom:.5rem}
.private table td,.private table th{font-size:.84rem;padding:.2em .35em}
@media (max-height:820px){ html{font-size:15.5px} .slide{padding:.75rem 1.05rem} }
@media (max-height:740px){ html{font-size:15px} }
@media (min-width:1600px) and (min-height:950px){ html{--fs:21px} .slide{max-width:1500px} }
@media (max-width:820px){ .grid2{grid-template-columns:1fr} .cols,ul.cols2{columns:1} }
@media print{ body{overflow:visible} .deck{display:block;height:auto} nav.bottom,.controls,.menu,.private,.draftbar,.bar{display:none!important} .slide{height:auto;border:0} }
body{overflow:auto;height:auto} .wrap{max-width:900px;margin:0 auto;padding:1rem} .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.2rem;margin:.8rem 0} .pair{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.4rem} .pair a{display:inline-flex;align-items:center;border:1.5px solid var(--accent);border-radius:8px;padding:.35em .9em;text-decoration:none;font-weight:600} .pair a.primary{background:var(--accent);color:#fff}</style>
</head>
<body>
<header class="top"><div class="brand">BFSU K–2 revision decks<small>Slide-by-slide revision presentations</small></div><div class="controls"><a style="color:var(--accent);font-weight:600" href="../index.html">← Science chapters home</a></div></header><main class="wrap"><div class="card"><div class="kicker">Session 1</div><h2>Matter and materials</h2><p class="small muted">BFSU A/B-1, A-2, A-4, A-5</p><div class="pair"><a class="primary" href="session-01-student.html">Student deck</a><a href="session-01-teacher.html">Teacher deck</a></div></div><p class="small muted">Written-practice submission links are private and supplied separately.</p></main>
</body>
</html>
